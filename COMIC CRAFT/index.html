<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1 id="heading">Hello, World!</h1>
    <p>Click the button below to trigger JavaScript action.</p>
    
    <div class="card">
      <p>Counter: <strong id="counter-value">0</strong></p>
      <div class="button-group">
        <button id="decrement-btn" class="btn btn-secondary">-1</button>
        <button id="increment-btn" class="btn btn-primary">+1</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
